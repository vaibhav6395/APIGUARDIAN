name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apiguardian
          POSTGRES_USER: apiguardian
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apiguardian -d apiguardian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/apiguardian
      DATABASE_USERNAME: apiguardian
      DATABASE_PASSWORD: ci_test_password
      JWT_SECRET: ci-only-test-secret-not-used-in-production-1234567890
      JWT_ISSUER: apiguardian-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        run: mvn -f backend/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Inspect dependency advisories
        working-directory: frontend
        run: |
          npm audit --json > audit-report.json || true
          node -e "const a=require('./audit-report.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(name, v.severity, JSON.stringify(v.fixAvailable));"
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --passWithNoTests
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_PASSWORD: ci_container_password
      JWT_SECRET: ci-container-only-signing-secret-0123456789abcdef
      WEB_PORT: 8088
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start deployment stack
        run: docker compose up --build -d
      - name: Wait for web health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8088/healthz; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify API health through Nginx
        run: curl --fail --silent http://127.0.0.1:8088/api/v1/health
      - name: Stop deployment stack
        if: always()
        run: docker compose down -v
