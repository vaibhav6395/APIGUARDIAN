name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apiguardian
          POSTGRES_USER: apiguardian
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apiguardian -d apiguardian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/apiguardian
      DATABASE_USERNAME: apiguardian
      DATABASE_PASSWORD: ci_test_password
      JWT_SECRET: ci-only-test-secret-not-used-in-production-1234567890
      JWT_ISSUER: apiguardian-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        run: mvn -f backend/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --passWithNoTests
      - name: Build frontend
        working-directory: frontend
        run: npm run build
