server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
spring:
  application:
    name: apiguardian
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/apiguardian}}
    username: ${DATABASE_USERNAME:apiguardian}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:apiguardian}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
